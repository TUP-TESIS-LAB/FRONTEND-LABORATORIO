<section class="worklist-page">
  <header class="worklist-header">
    <div>
      <h1>{{ config().title }}</h1>
      <p class="subtitle">{{ config().sub }}</p>
    </div>
    <div class="stats">
      <span class="chip">{{ total() }} · {{ config().countLabel }}</span>
      <span class="chip" [class.chip-selected]="selectedCount() > 0">
        {{ selectedCount() }} · seleccionada(s) de {{ total() }}
      </span>
    </div>
  </header>

  <div class="toolbar-wrap">
    <app-muestras-scan-bar
      [query]="query()"
      [selectionCount]="selectedCount()"
      [showBatchAction]="canTransition()"
      (queryChange)="setQuery($event)"
      (enterPressed)="onEnterScan($event)"
      (simulate)="simulateScan()"
      (clear)="clearSelection()"
      (openMenu)="openMenu()"
    />
    @if (canTransition()) {
      <app-muestras-batch-menu
        [transitions]="config().targets"
        [selectionCount]="selectedCount()"
        [open]="menuOpen()"
        (select)="selectTransition($event)"
        (closeMenu)="closeMenu()"
      />
    }
    @if (showWorksheetActions()) {
      <div class="worksheet-actions">
        <button type="button" class="ws-btn ws-btn--ghost" (click)="openPlanillas()">
          <i class="pi pi-table"></i> Planillas
        </button>
        <button type="button" class="ws-btn ws-btn--primary" disabled title="Próximamente">
          <i class="pi pi-check"></i> Marcar completadas
        </button>
      </div>
    }
  </div>

  <app-muestras-sample-table
    [rows]="rows()"
    [selectedIds]="selectedIds()"
    [leavingIds]="leavingIds()"
    [flashId]="flashId()"
    [screenKey]="config().key"
    (toggleRow)="toggleRow($event)"
    (toggleAll)="toggleAll()"
  />

  @if (activeTransition(); as t) {
    <app-muestras-transition-dialog
      [transition]="t"
      [samples]="selectedSamples()"
      [currentBranch]="currentBranch"
      [branches]="branches"
      [areas]="areas"
      [labs]="labs"
      (confirm)="confirmDialog($event)"
      (cancel)="cancelDialog()"
    />
  }

  @if (planillasOpen()) {
    <app-planillas-modal [visible]="planillasOpen()"
      (closed)="closePlanillas()" (newSheet)="onNewSheet()" (editSheet)="onEditSheet($event)" />
  }
  @if (configOpen()) {
    <app-worksheet-config-modal [visible]="configOpen()" [templateId]="editingTemplateId()"
      (closed)="closeConfig()" (saved)="onConfigSaved()" />
  }

  <p-toast position="bottom-right" />
</section>
