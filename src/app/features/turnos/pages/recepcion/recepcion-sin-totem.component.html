<div class="header">
  <h2>Turnos de hoy</h2>
  <div class="header__actions">
    @if (boxBranchId != null && boxCurrentUserId > 0) {
      <app-box-occupation-widget
        [branchId]="boxBranchId"
        [currentUserId]="boxCurrentUserId"
        [totalBoxes]="boxTotalBoxes" />
    }
    <p-button label="Atención nueva (walk-in)" (onClick)="onWalkIn()" />
  </div>
</div>

<p-table [value]="appointments()" [loading]="loading()">
  <ng-template pTemplate="header">
    <tr><th>Hora</th><th>Paciente</th><th></th></tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.appointmentTime | date: 'HH:mm' }}</td>
      <td>{{ row.patientName }}</td>
      <td>
        <p-button label="Atender" size="small" (onClick)="onAtender(row.id)" />
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr><td colspan="3">Sin turnos para hoy</td></tr>
  </ng-template>
</p-table>
