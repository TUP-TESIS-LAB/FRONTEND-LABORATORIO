<p-confirmDialog [draggable]="false" />

<div class="cola-espera">
  @if (!hasBranch()) {
    <div class="empty-branch">
      <i class="pi pi-info-circle"></i>
      <span>No hay sucursal asignada. Avisá al administrador.</span>
    </div>
  } @else {
    <ui-table
      [value]="entries()"
      [loading]="loading()"
      [columns]="columns"
      [rowClass]="rowClass"
      emptyHeading="No hay pacientes en cola."
      emptyIcon="pi-inbox">

      <ng-template uiCell="publicCode" let-row>
        {{ $any(row).publicCode }}
      </ng-template>

      <ng-template uiCell="dni" let-row>
        {{ $any(row).nationalId }}
      </ng-template>

      <ng-template uiCell="esperando" let-row>
        <span class="waiting-cell">{{ $any(row).createdAt | waitingTime }}</span>
      </ng-template>

      <ng-template uiCell="llamadas" let-row>
        @if ($any(row).callCount > 0) {
          <span class="call-count">{{ $any(row).callCount }}</span>
        }
      </ng-template>

      <ng-template uiCell="acciones" let-row>
        <app-queue-row-actions
          [entryId]="$any(row).id"
          (call)="onCall($any(row).id)"
          (nuevaAtencion)="onNuevaAtencion($any(row).id)"
          (cancel)="onCancel($any(row).id, $any(row).publicCode)" />
      </ng-template>
    </ui-table>
  }
</div>
