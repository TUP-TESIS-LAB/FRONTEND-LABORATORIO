<header class="recepcion-header">
  <h2 class="recepcion-title">Cola de espera</h2>
  <p-button
    icon="pi pi-calendar"
    label="Turnos del día"
    severity="secondary"
    [outlined]="true"
    size="small"
    [disabled]="!hasBranch()"
    (onClick)="toggleDrawer()" />
</header>

<p-card>
  @if (!hasBranch()) {
    <div class="empty-branch">
      <i class="pi pi-info-circle"></i>
      <span>No hay sucursal asignada. Avisá al administrador.</span>
    </div>
  } @else {
    <p-table
      [value]="entries()"
      [loading]="loading()"
      [rowTrackBy]="trackById">
      <ng-template pTemplate="header">
        <tr>
          <th>Código</th>
          <th>DNI</th>
          <th>Llamadas</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr [class]="rowClass(row)">
          <td>{{ row.publicCode }}</td>
          <td>{{ row.nationalId }}</td>
          <td>
            @if (row.callCount > 0) {
              <span class="call-count">{{ row.callCount }}</span>
            }
          </td>
          <td>
            <app-queue-row-actions
              [entryId]="row.id"
              (call)="onCall(row.id)"
              (nuevaAtencion)="onNuevaAtencion(row.id)" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="4">No hay pacientes en cola.</td></tr>
      </ng-template>
    </p-table>
  }
</p-card>

<app-scheduled-appointments-drawer
  [visible]="drawerOpen()"
  (visibleChange)="onDrawerVisibleChange($event)" />
