<div class="step">
  <p class="muted">Elegí la sucursal para la que estás configurando la agenda.</p>

  <form [formGroup]="form" class="form">
    <div class="form-field">
      <label for="branchId">Sucursal <span class="pat-form__req">*</span></label>
      <p-select
        inputId="branchId"
        formControlName="branchId"
        [options]="branches()"
        optionLabel="name"
        optionValue="id"
        appendTo="body"
      />
      @if (form.controls.branchId.touched && form.controls.branchId.invalid) {
        <small class="field-error">Seleccioná una sucursal para continuar.</small>
      }
    </div>
  </form>
</div>
