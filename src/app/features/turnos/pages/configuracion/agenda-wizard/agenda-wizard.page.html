<div class="agenda-wizard">
  <header class="page-header">
    <a class="back-btn" routerLink="/turnos/configuracion" aria-label="Volver">
      <i class="pi pi-arrow-left"></i>
    </a>
    <h1>{{ editingId() ? 'Editar agenda' : 'Nueva agenda' }}</h1>
    <span class="header-spacer"></span>
  </header>

  <!-- PrimeNG 21: p-step-list (headers) + p-step-panels (content) son hermanos dentro de p-stepper. -->
  <p-stepper
    [(value)]="currentStep"
    [linear]="!editingId()"
    class="agenda-stepper"
  >
    <p-step-list>
      <p-step [value]="1">Sucursal</p-step>
      <p-step
        [value]="2"
        [disabled]="branchId() == null"
        [pTooltip]="branchId() == null ? 'Elegí una sucursal primero' : ''"
        tooltipPosition="bottom"
      >Horario</p-step>
      <p-step
        [value]="3"
        [disabled]="horario() == null"
        [pTooltip]="horario() == null ? 'Completá el horario primero' : ''"
        tooltipPosition="bottom"
      >Período</p-step>
      <p-step
        [value]="4"
        [disabled]="!canShowConfirmar()"
        [pTooltip]="!canShowConfirmar() ? 'Completá los pasos anteriores primero' : ''"
        tooltipPosition="bottom"
      >Confirmar</p-step>
    </p-step-list>

    <p-step-panels>
      <p-step-panel [value]="1">
        <ng-template #content>
          <div class="step-content">
            <app-step-sucursal
              [initialBranchId]="branchId()"
              (next)="onSucursalNext($event)"
            />
          </div>
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="2">
        <ng-template #content>
          <div class="step-content">
            <app-step-horario
              [initial]="horario()"
              (next)="onHorarioNext($event)"
              (back)="goToStep(1)"
            />
          </div>
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="3">
        <ng-template #content>
          <div class="step-content">
            <app-step-periodo
              [initial]="periodo()"
              (next)="onPeriodoNext($event)"
              (back)="goToStep(2)"
            />
          </div>
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="4">
        <ng-template #content>
          <div class="step-content">
            @if (canShowConfirmar()) {
              <app-step-confirmar
                [summary]="summary()"
                [saving]="saving()"
                (confirm)="confirm()"
                (back)="goToStep(3)"
              />
            } @else {
              <p class="muted">Completá los pasos anteriores primero.</p>
            }
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>

  <p-toast />
</div>
