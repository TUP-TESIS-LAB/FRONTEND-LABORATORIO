<div class="agenda-wizard">
  <header class="page-header">
    <a class="back-btn" routerLink="/turnos/configuracion" aria-label="Volver">
      <i class="pi pi-arrow-left"></i>
    </a>
    <h1>{{ editingId() ? 'Editar agenda' : 'Nueva agenda' }}</h1>
    <span class="header-spacer"></span>
  </header>

  <app-form-stepper-header
    [steps]="steps"
    [currentIndex]="currentStep()"
    [visited]="visited()"
    (stepSelected)="goToStep($event)" />

  <div class="step-content">
    @switch (currentStep()) {
      @case (0) {
        <app-step-sucursal
          [initialBranchId]="branchId()"
          (next)="onSucursalNext($event)" />
      }
      @case (1) {
        <app-step-horario
          [initial]="horario()"
          (next)="onHorarioNext($event)"
          (back)="goBack()" />
      }
      @case (2) {
        <app-step-periodo
          [initial]="periodo()"
          (next)="onPeriodoNext($event)"
          (back)="goBack()" />
      }
      @case (3) {
        @if (canShowConfirmar()) {
          <app-step-confirmar
            [summary]="summary()"
            [saving]="saving()"
            (confirm)="confirm()"
            (back)="goBack()" />
        } @else {
          <p class="muted">Completá los pasos anteriores primero.</p>
        }
      }
    }
  </div>

  <p-toast />
</div>
