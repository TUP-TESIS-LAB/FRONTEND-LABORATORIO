<div class="totem-tab">
  <h2>Tótem</h2>
  <p class="muted">
    Habilitá el tótem físico para que esta sucursal acepte walk-ins (pacientes sin turno previo).
    Si está deshabilitado, la pantalla de recepción muestra solo la lista de turnos pendientes.
  </p>

  <div class="big-switch">
    <p-toggleswitch [ngModel]="enabled()" (ngModelChange)="onToggle($event)" />
    <span class="switch-label">{{ enabled() ? 'Tótem habilitado' : 'Tótem deshabilitado' }}</span>
  </div>
</div>
