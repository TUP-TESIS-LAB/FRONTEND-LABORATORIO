<div class="page-header">
  <h1>Sucursales</h1>
  <p-button label="Nueva sucursal" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<p-table [value]="sucursales()" [loading]="loading()" responsiveLayout="scroll">
  <ng-template pTemplate="header">
    <tr>
      <th>Código</th>
      <th>Descripción</th>
      <th>Estado</th>
      <th>Dirección</th>
      <th style="width: 200px">Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-s>
    <tr>
      <td>{{ s.code }}</td>
      <td>{{ s.description }}</td>
      <td><p-tag [value]="s.status" [severity]="s.status === 'ACTIVE' ? 'success' : 'secondary'" /></td>
      <td>{{ formatAddress(s) }}</td>
      <td>
        <p-button icon="pi pi-pencil" text rounded (onClick)="openEdit(s)" />
        <p-button icon="pi pi-refresh" text rounded (onClick)="toggle(s)" />
        <p-button icon="pi pi-trash" text rounded severity="danger" (onClick)="remove(s)" />
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr><td colspan="5">Sin sucursales todavía.</td></tr>
  </ng-template>
</p-table>

<p-confirmDialog />
<p-toast />

@if (modalOpen()) {
  <app-sucursal-form-modal [sucursal]="editing()" (closed)="closeModal()" />
}
