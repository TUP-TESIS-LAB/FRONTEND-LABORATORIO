<div class="py-2">
  <header class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold m-0">Sucursales</h2>
    <p-button label="Nueva sucursal" icon="pi pi-plus" (onClick)="openNew()" />
  </header>

  <ui-table
    [value]="sucursales()"
    [loading]="loading()"
    [columns]="columns"
    [showEdit]="true"
    [showDelete]="true"
    emptyHeading="Sin sucursales"
    emptyIcon="pi-building"
    emptyDescription="Agregá la primera sucursal del laboratorio."
    emptyCtaLabel="Nueva sucursal"
    (edit)="openDetail($any($event))"
    (rowDelete)="remove($any($event))"
    (emptyCtaClick)="openNew()">

    <ng-template uiCell="estado" let-row>
      <p-tag
        [value]="$any(row).status === 'ACTIVE' ? 'Activa' : 'Inactiva'"
        [severity]="$any(row).status === 'ACTIVE' ? 'success' : 'secondary'" />
    </ng-template>

    <ng-template uiCell="direccion" let-row>
      {{ formatAddress($any(row)) }}
    </ng-template>
  </ui-table>

  <p-confirmDialog />
  <p-toast />
</div>
