<div class="contactos-step">
  <h2>Contactos</h2>
  <p class="muted">Agregá teléfonos, email, sitio web y otros canales de contacto.</p>

  <form [formGroup]="form" (ngSubmit)="add()" class="inline-form">
    <div class="form-field">
      <label>Tipo *</label>
      <p-select formControlName="contactType" [options]="typeOptions" optionLabel="label" optionValue="value" appendTo="body" />
    </div>
    <div class="form-field grow">
      <label>Valor *</label>
      <input pInputText [type]="currentTypeConfig().inputType" [placeholder]="currentTypeConfig().placeholder" formControlName="value" />
      @if (form.controls.value.invalid && form.controls.value.touched) {
        <small class="form-error">Ingresá un valor válido para el tipo seleccionado.</small>
      }
    </div>
    <div class="form-action">
      <p-button icon="pi pi-plus" type="submit" [disabled]="form.invalid" />
    </div>
  </form>

  <p-table [value]="contacts()" dataKey="id" [scrollable]="true" scrollHeight="20rem" class="contacts-table">
    <ng-template pTemplate="header">
      <tr><th>Tipo</th><th>Valor</th><th style="width: 4rem"></th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-c>
      <tr>
        <td>{{ labelForType(c.contactType) }}</td>
        <td>{{ c.value }}</td>
        <td><p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (click)="remove(c.id)" /></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="3" class="muted">Sin contactos cargados.</td></tr>
    </ng-template>
  </p-table>

  <footer class="step-footer">
    <p-button label="Volver" severity="secondary" (click)="back.emit()" />
    <p-button label="Siguiente" (click)="next.emit()" />
  </footer>
</div>
