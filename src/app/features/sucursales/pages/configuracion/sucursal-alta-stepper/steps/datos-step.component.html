<div class="datos-step">
  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <div class="form-field">
      <label for="code">Nombre <span class="pat-form__req">*</span></label>
      <input id="code" pInputText formControlName="code" />
      @if (form.controls.code.invalid && form.controls.code.touched) {
        <small class="form-error">El nombre es requerido (máx 30 caracteres).</small>
      }
    </div>

    <div class="address-section">
      <div class="form-row address-row" formGroupName="address">
        <div class="form-field">
          <label for="street">Calle</label>
          <input id="street" pInputText formControlName="street" />
        </div>
        <div class="form-field">
          <label for="streetNumber">Número</label>
          <input id="streetNumber" pInputText formControlName="streetNumber" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="provinceId">Provincia</label>
          <p-select
            inputId="provinceId"
            formControlName="provinceId"
            [options]="provinces()"
            optionLabel="name"
            optionValue="id"
            [showClear]="true"
            appendTo="body"
          />
        </div>
        <div class="form-field" formGroupName="address">
          <label for="cityId">Ciudad</label>
          <p-select
            inputId="cityId"
            formControlName="cityId"
            [options]="cities()"
            optionLabel="name"
            optionValue="id"
            [disabled]="form.controls.provinceId.value == null"
            [showClear]="true"
            appendTo="body"
          />
        </div>
      </div>
    </div>
  </form>
</div>
