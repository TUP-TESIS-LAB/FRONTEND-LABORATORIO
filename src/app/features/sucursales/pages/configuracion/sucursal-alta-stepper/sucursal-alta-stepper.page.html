<div class="alta-page">
  <header class="page-header">
    <button class="back-btn" (click)="cancel()" type="button">
      <i class="pi pi-arrow-left"></i>
    </button>
    <h1>Nueva sucursal</h1>
    <span class="header-spacer"></span>
  </header>

  <app-form-stepper-header
    [steps]="steps"
    [currentIndex]="currentStep()"
    [visited]="visited()"
    (stepSelected)="goToStep($event)" />

  <div class="step-content">
    @switch (currentStep()) {
      @case (0) {
        <app-datos-step (completed)="onDatosCompleted($event)" (cancel)="cancel()" />
      }
      @case (1) {
        <app-horarios-step
          [branchId]="branchId()!"
          (next)="goToStep(2)"
          (back)="goToStep(0)" />
      }
      @case (2) {
        <app-contactos-step
          [branchId]="branchId()!"
          (next)="goToStep(3)"
          (back)="goToStep(1)" />
      }
      @case (3) {
        <app-workspaces-step
          [branchId]="branchId()!"
          (next)="goToStep(4)"
          (back)="goToStep(2)" />
      }
      @case (4) {
        <app-totem-step
          [branchId]="branchId()!"
          (next)="goToStep(5)"
          (back)="goToStep(3)" />
      }
      @case (5) {
        <app-confirmar-step (finish)="finish()" (back)="goToStep(4)" />
      }
    }
  </div>

  <p-toast />
</div>
