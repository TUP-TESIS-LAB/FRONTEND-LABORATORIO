<ui-wizard-shell
  [heading]="heading()"
  [breadcrumb]="breadcrumb()"
  [steps]="steps()"
  [currentIndex]="currentStep()"
  [visited]="visited()"
  [completed]="completed()"
  [continueDisabled]="continueDisabled()"
  [continueLoading]="continueLoading()"
  [finishLoading]="finishing()"
  (stepSelected)="goToStep($event)"
  (next)="onNext()"
  (back)="goBack()"
  (cancel)="cancel()"
  (finish)="finish()">
  @switch (currentStep()) {
    @case (0) {
      @if (editMode()) {
        <app-datos-tab [branchId]="branchId()!" />
      } @else {
        <app-datos-step #step0
          (completed)="onDatosCompleted($event)"
          (failed)="onDatosFailed()"
          (validChange)="step0Valid.set($event)" />
      }
    }
    @case (1) { <app-horarios-step [branchId]="branchId()!" /> }
    @case (2) { <app-contactos-step [branchId]="branchId()!" /> }
    @case (3) { <app-workspaces-step [branchId]="branchId()!" /> }
    @case (4) { <app-totem-step #totemStep [branchId]="branchId()!" /> }
    @case (5) { <app-confirmar-step /> }
  }
</ui-wizard-shell>

<p-toast />
