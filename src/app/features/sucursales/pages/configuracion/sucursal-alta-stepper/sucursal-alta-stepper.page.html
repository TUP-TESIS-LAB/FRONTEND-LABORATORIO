<div class="alta-page">
  <header class="page-header">
    <button class="back-btn" (click)="cancel()" type="button">
      <i class="pi pi-arrow-left"></i>
    </button>
    <h1>Nueva sucursal</h1>
    <span class="header-spacer"></span>
  </header>

  <!-- PrimeNG 21 Stepper: p-stepper > p-step-item > p-step + p-step-panel -->
  <p-stepper [(value)]="currentStep" [linear]="false" class="alta-stepper">

    <!-- Step 1: Datos — T8 -->
    <p-step-item [value]="1">
      <p-step>Datos</p-step>
      <p-step-panel>
        <ng-template #content let-activateCallback="activateCallback">
          <div class="step-content">
            <app-datos-step (completed)="onDatosCompleted($event)" />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-item>

    <!-- Step 2: Horarios — T9 -->
    <p-step-item [value]="2">
      <p-step [disabled]="branchId() == null">Horarios</p-step>
      <p-step-panel>
        <ng-template #content let-activateCallback="activateCallback">
          <div class="step-content">
            <app-horarios-step [branchId]="branchId()!" (next)="goToStep(3)" (back)="goToStep(1)" />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-item>

    <!-- Step 3: Contactos — T10 reemplazará este placeholder -->
    <p-step-item [value]="3">
      <p-step [disabled]="branchId() == null">Contactos</p-step>
      <p-step-panel>
        <ng-template #content let-activateCallback="activateCallback">
          <div class="step-content">
            <app-contactos-step [branchId]="branchId()!" (next)="goToStep(4)" (back)="goToStep(2)" />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-item>

    <!-- Step 4: Workspaces — T11 -->
    <p-step-item [value]="4">
      <p-step [disabled]="branchId() == null">Workspaces</p-step>
      <p-step-panel>
        <ng-template #content let-activateCallback="activateCallback">
          <div class="step-content">
            <app-workspaces-step [branchId]="branchId()!" (next)="goToStep(5)" (back)="goToStep(3)" />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-item>

    <!-- Step 5: Tótem — T12 -->
    <p-step-item [value]="5">
      <p-step [disabled]="branchId() == null">Tótem</p-step>
      <p-step-panel>
        <ng-template #content let-activateCallback="activateCallback">
          <div class="step-content">
            <app-totem-step [branchId]="branchId()!" (next)="goToStep(6)" (back)="goToStep(4)" />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-item>

    <!-- Step 6: Confirmar — T13 reemplazará este placeholder -->
    <p-step-item [value]="6">
      <p-step [disabled]="branchId() == null">Confirmar</p-step>
      <p-step-panel>
        <ng-template #content let-activateCallback="activateCallback">
          <div class="step-content">
            <app-confirmar-step [branchId]="branchId()!" (finish)="finish()" (back)="goToStep(5)" />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-item>

  </p-stepper>

  <p-toast />
</div>
